name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            agent/go.sum
            contracts/go.sum
            server/go.sum
      - name: Validate version tag
        shell: bash
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9._-]+)?$ ]]'
      - name: Build Linux release archives
        run: deploy/release/build-binaries.sh "$GITHUB_REF_NAME" dist/archives
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate archive SPDX SBOMs
        run: deploy/ops/release-metadata.sh --output-dir dist/release dist/archives/*.tar.gz
      - name: Verify release metadata
        run: deploy/ops/verify-release.sh dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  scan-images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [server, web]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve candidate image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}:candidate-${GITHUB_SHA}-${{ matrix.arch }}" >>"$GITHUB_OUTPUT"
      - name: Build scan image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}
      - name: Block HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.67.2
          image-ref: ${{ steps.image.outputs.name }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Generate image SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.name }}
          format: spdx-json
          output-file: frp-admin-${{ matrix.component }}-linux-${{ matrix.arch }}.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-sbom-${{ matrix.component }}-${{ matrix.arch }}
          path: frp-admin-${{ matrix.component }}-linux-${{ matrix.arch }}.spdx.json
          if-no-files-found: error
          retention-days: 7
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push scanned candidate image
        run: docker push "${{ steps.image.outputs.name }}"

  publish-images:
    needs: scan-images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: [server, web]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3.10.0
      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}" >>"$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest from scanned candidates
        id: manifest
        shell: bash
        run: |
          image='${{ steps.image.outputs.name }}'
          docker buildx imagetools create \
            --tag "$image:$GITHUB_REF_NAME" \
            --tag "$image:sha-$GITHUB_SHA" \
            "$image:candidate-$GITHUB_SHA-amd64" \
            "$image:candidate-$GITHUB_SHA-arm64"
          inspection=$(docker buildx imagetools inspect "$image:$GITHUB_REF_NAME")
          printf '%s\n' "$inspection"
          digest=$(awk '$1 == "Digest:" {print $2; exit}' <<<"$inspection")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "subject=$image@$digest" >>"$GITHUB_OUTPUT"
      - name: Keyless-sign immutable manifest digest
        env:
          COSIGN_YES: 'true'
        run: cosign sign "${{ steps.manifest.outputs.subject }}"

  github-release:
    needs: [binaries, scan-images, publish-images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-binaries
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: image-sbom-*
          path: dist/release
          merge-multiple: true
      - name: Rebuild and verify complete checksums
        run: |
          deploy/release/checksums.sh dist/release
          deploy/ops/verify-release.sh dist/release
      - name: Attest release artifacts and checksum manifest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
