name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            agent/go.sum
            contracts/go.sum
            server/go.sum
      - name: Test contracts
        working-directory: contracts
        run: go test ./...
      - name: Test agent
        working-directory: agent
        run: go test ./...
      - name: Test server
        working-directory: server
        run: go test ./...
      - name: Race test critical paths
        run: |
          (cd agent && go test -race ./internal/channel ./internal/configmgr ./internal/executor ./internal/upgrader)
          (cd server && go test -race ./internal/agentgateway ./internal/auth ./internal/configcrypto ./internal/configuration ./internal/httpapi ./migrations)
      - name: Vet
        run: |
          (cd contracts && go vet ./...)
          (cd agent && go vet ./...)
          (cd server && go vet ./...)
      - name: Build
        run: |
          go build -o /tmp/frp-agent ./agent/cmd/frp-agent
          go build -o /tmp/frp-admin-server ./server/cmd/frp-admin-server

  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - uses: arduino/setup-protoc@v3
        with:
          version: '29.x'
      - name: Install generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Regenerate contracts
        working-directory: contracts
        run: ./scripts/generate.sh
      - name: Verify generated code is committed
        run: git diff --exit-code -- contracts/gen

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npm test -- --run
      - working-directory: web
        run: npm run build

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run real browser E2E
        run: ./deploy/e2e/web/run.sh
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-failure-${{ github.run_id }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: mysql
            dsn: frpadmin:frpadmin@tcp(127.0.0.1:3306)/frpadmin?parseTime=true
          - driver: postgres
            dsn: postgres://frpadmin:frpadmin@127.0.0.1:5432/frpadmin?sslmode=disable
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: frpadmin
          MYSQL_USER: frpadmin
          MYSQL_PASSWORD: frpadmin
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: frpadmin
          POSTGRES_USER: frpadmin
          POSTGRES_PASSWORD: frpadmin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U frpadmin -d frpadmin"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Run database smoke test
        env:
          FRP_ADMIN_DATABASE_DRIVER: ${{ matrix.driver }}
          FRP_ADMIN_DATABASE_DSN: ${{ matrix.dsn }}
          FRP_ADMIN_AUTH_SECURE_COOKIES: 'false'
          FRP_ADMIN_BOOTSTRAP_TOKEN: ci-bootstrap-token
        run: |
          go run ./server/cmd/frp-admin-server > /tmp/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/health/ready && exit 0
            sleep 1
          done
          cat /tmp/server.log
          exit 1
      - name: Run database contract tests
        working-directory: server
        env:
          FRP_ADMIN_INTEGRATION_DB_DRIVER: ${{ matrix.driver }}
          FRP_ADMIN_INTEGRATION_DB_DSN: ${{ matrix.dsn }}
        run: go test ./internal/store/sqlstore -run 'TestDatabase(Contract|MigrationReplay)' -count=1

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: frp-admin-server:ci
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          tags: frp-admin-web:ci

  agent-systemd-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Shellcheck E2E assets
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck sqlite3
          shellcheck -x deploy/e2e/systemd/*.sh deploy/e2e/systemd/frp-e2e-prestart deploy/e2e/controlplane/*.sh deploy/ops/*.sh
      - name: Run backup and restore regression
        run: deploy/ops/test.sh
      - name: Run privileged Ubuntu systemd E2E
        run: ./deploy/e2e/systemd/run-container.sh
      - name: Run real control-plane E2E and reconnect smoke
        env:
          FRP_CONTROLPLANE_LOAD_AGENTS: '25'
        run: ./deploy/e2e/controlplane/run-container.sh
