name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            agent/go.sum
            contracts/go.sum
            server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan Go modules
        run: |
          (cd contracts && govulncheck ./...)
          (cd agent && govulncheck ./...)
          (cd server && govulncheck ./...)
      - name: Scan production web dependencies
        working-directory: web
        run: npm run audit:production

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: server/Dockerfile
          - name: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: frp-admin-${{ matrix.name }}:security-scan
      - name: Scan image
        uses: aquasecurity/trivy-action@0.32.0
        with:
          version: v0.67.2
          image-ref: frp-admin-${{ matrix.name }}:security-scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: frp-admin-${{ matrix.name }}:security-scan
          format: spdx-json
          output-file: frp-admin-${{ matrix.name }}.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frp-admin-${{ matrix.name }}-sbom
          path: frp-admin-${{ matrix.name }}.spdx.json
          if-no-files-found: error
          retention-days: 30
