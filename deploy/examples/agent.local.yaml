serverURL: https://127.0.0.1:8443
role: client
nodeID: ""
stateDir: /tmp/frp-admin-agent
tls:
  serverName: localhost
frp:
  serviceName: frpc.service
  binaryPath: /opt/frp/bin/frpc
  configPath: /etc/frp/frpc.toml
  adminAPI:
    endpoint: http://127.0.0.1:7400
    username: runtime-reader
    passwordFile: /run/credentials/frp-agent.service/frp-admin-api-password
    timeout: 3s
    maxResponseBytes: 1048576
channel:
  heartbeatInterval: 15s
  reconnectMin: 1s
  reconnectMax: 1m
