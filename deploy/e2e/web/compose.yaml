services:
  server:
    build:
      context: ../../..
      dockerfile: server/Dockerfile
    environment:
      FRP_ADMIN_HTTP_ADDRESS: :8080
      FRP_ADMIN_GRPC_ADDRESS: :8443
      FRP_ADMIN_DATABASE_DRIVER: sqlite
      FRP_ADMIN_DATABASE_DSN: /app/data/e2e.db
      FRP_ADMIN_PKI_DIRECTORY: /app/data/pki
      FRP_ADMIN_AUTH_SECURE_COOKIES: "false"
      FRP_ADMIN_BOOTSTRAP_TOKEN: ${E2E_BOOTSTRAP_TOKEN:?E2E_BOOTSTRAP_TOKEN is required}
    volumes:
      - e2e-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 40

  web:
    build:
      context: ../../..
      dockerfile: web/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${E2E_WEB_PORT:?E2E_WEB_PORT is required}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  e2e-data:
