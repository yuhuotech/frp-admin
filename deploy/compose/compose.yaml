services:
  server:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    environment:
      FRP_ADMIN_HTTP_ADDRESS: :8080
      FRP_ADMIN_GRPC_ADDRESS: :8443
      FRP_ADMIN_DATABASE_DRIVER: sqlite
      FRP_ADMIN_DATABASE_DSN: /app/data/frp-admin.db
      FRP_ADMIN_PKI_DIRECTORY: /app/data/pki
      FRP_ADMIN_AUTH_SECURE_COOKIES: "false"
      FRP_ADMIN_BOOTSTRAP_TOKEN: ${FRP_ADMIN_BOOTSTRAP_TOKEN:?set FRP_ADMIN_BOOTSTRAP_TOKEN in .env}
    volumes:
      - frp-admin-data:/app/data
    ports:
      - "127.0.0.1:8443:8443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    restart: unless-stopped

volumes:
  frp-admin-data:
