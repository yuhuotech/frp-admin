serverURL: https://admin.example.com:8443
role: client
nodeID: ""
stateDir: /var/lib/frp-agent
tls:
  serverName: admin.example.com
frp:
  # The Agent auto-discovers these values from systemd/launchd, the running
  # process command line, and known FRP installation paths when omitted.
  serviceName: frpc.service
  # macOS launchd label and plist path. Leave launchdPlistPath empty on Linux.
  # serviceName: homebrew.mxcl.frpc
  # launchdPlistPath: /Users/your-user/Library/LaunchAgents/homebrew.mxcl.frpc.plist
  binaryPath: /opt/frp/bin/frpc
  configPath: /etc/frp/frpc.toml
  helperSocket: /run/frp-agent-helper.sock
channel:
  heartbeatInterval: 15s
  reconnectMin: 1s
  reconnectMax: 1m
upgrade:
  allowedHosts:
    - github.com
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com
  maxArtifactBytes: 268435456
